  <style>
    /* ===== Base ===== */
    html { scroll-behavior: smooth; }
    body { font-feature-settings: 'cv02','cv03','cv04','cv11'; }
    ::selection { background: #FF4D4D; color: #fff; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,77,77,0.35); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,77,77,0.6); }

    /* ===== Glass morphism ===== */
    .glass { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
    .glass-strong { backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); }
    .glass-subtle { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

    /* ===== Skeleton screen ===== */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
      border-radius: 8px;
    }
    .dark .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; }

    /* ===== Nav scroll states ===== */
    #navbar { transition: background 0.3s ease, box-shadow 0.3s ease, backdrop-filter 0.3s ease; }
    #navbar.scrolled { background: rgba(10,10,15,0.85); box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
    .light #navbar.scrolled { background: rgba(255,255,255,0.85); box-shadow: 0 4px 30px rgba(0,0,0,0.08); }

    /* ===== Hero Carousel ===== */
    .hero-slide { opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; }
    .hero-slide.active { opacity: 1; transform: scale(1); }
    .hero-slide.inactive { opacity: 0; transform: scale(1.05); }
    .hero-indicator { transition: all 0.4s ease; cursor: pointer; }
    .hero-indicator.active { width: 32px; background: #FF4D4D; }

    /* ===== Movie Cards ===== */
    .movie-card { transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.35s ease; }
    .movie-card:hover { transform: translateY(-8px); box-shadow: 0 24px 60px rgba(255,77,77,0.15); }
    .movie-card .card-overlay { opacity: 0; transition: opacity 0.35s ease; }
    .movie-card:hover .card-overlay { opacity: 1; }
    .movie-card .card-poster { transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .movie-card:hover .card-poster { transform: scale(1.08); }

    /* ===== Trailer Modal ===== */
    .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-content { transform: scale(0.92); opacity: 0; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease; }
    .modal-overlay.open .modal-content { transform: scale(1); opacity: 1; }

    /* ===== Theme transition ===== */
    body, #navbar, .movie-card, .modal-content { transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease; }

    /* ===== Filter Chips ===== */
    .filter-chip { transition: all 0.3s ease; }
    .filter-chip.active { background: #FF4D4D !important; color: #fff !important; border-color: #FF4D4D !important; }

    /* ===== YouTube BG player ===== */
    #heroYtContainer { pointer-events: none; }
    #heroYtContainer iframe { pointer-events: none; }

    /* ===== Rating badge shimmer ===== */
    .rating-badge { text-shadow: 0 0 10px rgba(245,197,24,0.3); }

    /* ===== Loading spinner ===== */
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader { animation: spin 0.8s linear infinite; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <script>
  (function() {

    /* ================================================================

    /* ================================================================
     *  GLOBAL STATE
     * ================================================================ */
    let currentGenre = 'all';
    let currentTime  = 'all';
    let displayedCount = 0;
    const PER_PAGE = 10;
    let heroIndex = 0;
    let heroTimer = null;
    let ytPlayer = null;
    let ytBgPlayer = null;
    let isModalOpen = false;
    let isDarkMode = true;

    /* ================================================================
     *  DOM REFS
     * ================================================================ */
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    /* ================================================================
     *  THEME TOGGLE
     * ================================================================ */
    function initTheme() {
      const saved = localStorage.getItem('moviehub-theme');
      isDarkMode = saved !== 'light';
      applyTheme();
      $('#themeToggle').addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        applyTheme();
        localStorage.setItem('moviehub-theme', isDarkMode ? 'dark' : 'light');
      });
    }

    function applyTheme() {
      const html = document.documentElement;
      const icon = $('#themeIcon');
      if (isDarkMode) {
        html.classList.add('dark'); html.classList.remove('light');
        if (icon) { icon.className = 'fa-solid fa-moon text-lg'; }
      } else {
        html.classList.remove('dark'); html.classList.add('light');
        if (icon) { icon.className = 'fa-solid fa-sun text-lg'; }
      }
    }

    /* ================================================================
     *  NAV SCROLL EFFECT
     * ================================================================ */
    function initNavScroll() {
      const nav = $('#navbar');
      window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    }

    /* ================================================================
     *  MOBILE MENU
     * ================================================================ */
    function initMobileMenu() {
      const btn = $('#mobileMenuBtn');
      const panel = $('#mobileSearch');
      btn.addEventListener('click', () => {
        panel.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', !panel.classList.contains('hidden'));
      });
    }

    /* ================================================================
     *  SEARCH
     * ================================================================ */
    function initSearch() {
      const desktop = $('#searchInput');
      const mobile  = $('#searchInputMobile');
      const clearBtn = $('#clearSearch');

      function handleInput() {
        clearBtn.classList.toggle('hidden', !this.value);
        renderMovies();
      }
      desktop.addEventListener('input', handleInput);
      mobile.addEventListener('input', handleInput);
      // Sync desktop/mobile
      desktop.addEventListener('input', () => { mobile.value = desktop.value; });
      mobile.addEventListener('input', () => { desktop.value = mobile.value; });
      clearBtn.addEventListener('click', () => {
        desktop.value = ''; mobile.value = '';
        clearBtn.classList.add('hidden');
        renderMovies();
      });
    }

    /* ================================================================
     *  FILTERS
     * ================================================================ */
    function initFilters() {
      // Genre
      $('#genreFilters').addEventListener('click', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;
        $$('#genreFilters .filter-chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-checked','false'); });
        chip.classList.add('active'); chip.setAttribute('aria-checked','true');
        currentGenre = chip.dataset.genre;
        resetAndRender();
      });
      // Time
      $('#timeFilters').addEventListener('click', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;
        $$('#timeFilters .filter-chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-checked','false'); });
        chip.classList.add('active'); chip.setAttribute('aria-checked','true');
        currentTime = chip.dataset.time;
        resetAndRender();
      });
    }

    function getFilteredMovies() {
      const search = ($('#searchInput').value || '').trim().toLowerCase();
      let list = MOVIES.slice();

      // Genre filter
      if (currentGenre !== 'all') {
        list = list.filter(m => m.genres.includes(currentGenre));
      }
      // Time filter
      const now = new Date('2026-06-01');
      if (currentTime === 'this-week') {
        const weekLater = new Date(now); weekLater.setDate(now.getDate() + 7);
        list = list.filter(m => { const d = new Date(m.releaseDate); return d >= now && d <= weekLater; });
      } else if (currentTime === 'this-month') {
        const monthLater = new Date(now); monthLater.setMonth(now.getMonth() + 1);
        list = list.filter(m => { const d = new Date(m.releaseDate); return d >= now && d <= monthLater; });
      } else if (currentTime === 'upcoming') {
        list = list.filter(m => m.isUpcoming);
      }
      // Search
      if (search) {
        list = list.filter(m =>
          m.title.includes(search) ||
          m.titleEn.toLowerCase().includes(search) ||
          m.genres.some(g => g.includes(search)) ||
          m.director.includes(search)
        );
      }
      return list;
    }

    function resetAndRender() {
      displayedCount = 0;
      $('#movieGrid').innerHTML = '';
      $('#noMoreMovies').classList.add('hidden');
      $('#loadMoreTrigger').classList.remove('hidden');
      renderMovies();
    }

    /* ================================================================
     *  RENDER MOVIES
     * ================================================================ */
    function renderMovies() {
      const filtered = getFilteredMovies();
      $('#resultsCount').textContent = `共找到 ${filtered.length} 部电影`;

      // Reset
      if (displayedCount === 0) {
        $('#movieGrid').innerHTML = '';
        $('#noMoreMovies').classList.add('hidden');
        $('#loadMoreTrigger').classList.remove('hidden');
      }

      const toShow = filtered.slice(0, displayedCount + PER_PAGE);
      displayedCount = Math.min(displayedCount + PER_PAGE, filtered.length);

      if (displayedCount >= filtered.length) {
        $('#loadMoreTrigger').classList.add('hidden');
        if (filtered.length > 0) $('#noMoreMovies').classList.remove('hidden');
      }

      if (filtered.length === 0) {
        $('#movieGrid').innerHTML = `<div class="col-span-full text-center py-20">
          <i class="fa-solid fa-film text-5xl dark:text-gray-700 text-gray-300 mb-4 block"></i>
          <p class="dark:text-gray-500 text-gray-400">没有找到匹配的电影</p>
        </div>`;
        $('#loadMoreTrigger').classList.add('hidden');
        return;
      }

      // Build cards
      const grid = $('#movieGrid');
      const startIdx = grid.children.length;
      for (let i = startIdx; i < displayedCount; i++) {
        if (i >= filtered.length) break;
        const m = filtered[i];
        const card = createMovieCard(m);
        grid.appendChild(card);
      }
    }

    function createMovieCard(m) {
      const card = document.createElement('div');
      card.className = 'movie-card group relative rounded-2xl overflow-hidden cursor-pointer dark:bg-navy-700/50 bg-white border dark:border-white/5 border-gray-200 shadow-lg';
      card.setAttribute('role', 'listitem');
      card.tabIndex = 0;
      card.setAttribute('aria-label', `${m.title} — ${m.genres.join('、')}，评分 ${m.rating}`);
      card.innerHTML = `
        <!-- Poster -->
        <div class="relative aspect-[2/3] overflow-hidden">
          <div class="card-poster w-full h-full flex items-center justify-center" style="background:${m.posterColor}">
            <span class="text-6xl sm:text-7xl opacity-30 select-none">${m.posterEmoji}</span>
          </div>
          <!-- Gradient overlay -->
          <div class="card-overlay absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-4">
            <p class="text-white text-xs leading-relaxed line-clamp-3 mb-3">${m.description}</p>
            <button class="w-full py-2.5 rounded-xl bg-brand-400 hover:bg-brand-500 text-white text-sm font-semibold flex items-center justify-center gap-2 transition-colors" onclick="event.stopPropagation(); openTrailer('${m.trailerId}','${m.title}')">
              <i class="fa-solid fa-play text-xs"></i> 播放预告片
            </button>
          </div>
          <!-- Rating badge -->
          <div class="absolute top-3 left-3 bg-black/70 glass-subtle rounded-lg px-2.5 py-1 flex items-center gap-1">
            <i class="fa-solid fa-star text-yellow-400 text-xs"></i>
            <span class="text-white text-xs font-bold">${m.rating}</span>
          </div>
          <!-- Upcoming badge -->
          ${m.isUpcoming ? '<div class="absolute top-3 right-3 bg-brand-400/90 rounded-lg px-2.5 py-1"><span class="text-white text-[10px] font-bold uppercase tracking-wider">即将上映</span></div>' : ''}
        </div>
        <!-- Info -->
        <div class="p-3 sm:p-4">
          <h3 class="font-bold text-sm sm:text-base dark:text-white truncate">${m.title}</h3>
          <p class="text-xs dark:text-gray-500 text-gray-400 mt-0.5">${m.titleEn}</p>
          <div class="flex flex-wrap gap-1.5 mt-2.5">
            ${m.genres.map(g => `<span class="text-[10px] px-2 py-0.5 rounded-md dark:bg-white/5 bg-gray-100 dark:text-gray-400 text-gray-500">${g}</span>`).join('')}
          </div>
          <div class="flex items-center justify-between mt-3 text-[11px] dark:text-gray-500 text-gray-400">
            <span>${m.releaseDate}</span>
            <span>${m.duration}</span>
          </div>
        </div>
      `;
      card.addEventListener('click', () => openTrailer(m.trailerId, m.title));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openTrailer(m.trailerId, m.title); });
      return card;
    }

    /* ================================================================
     *  INFINITE SCROLL
     * ================================================================ */
    function initInfiniteScroll() {
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          const filtered = getFilteredMovies();
          if (displayedCount >= filtered.length) return;
          showSkeletons();
          setTimeout(() => {
            hideSkeletons();
            renderMovies();
          }, 600);
        }
      }, { rootMargin: '200px' });
      observer.observe($('#loadMoreTrigger'));
    }

    function showSkeletons() {
      const grid = $('#skeletonGrid');
      grid.classList.remove('hidden');
      grid.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const sk = document.createElement('div');
        sk.innerHTML = `
          <div class="rounded-2xl overflow-hidden">
            <div class="skeleton aspect-[2/3] w-full"></div>
            <div class="p-3 space-y-2">
              <div class="skeleton h-4 w-3/4"></div>
              <div class="skeleton h-3 w-1/2"></div>
              <div class="flex gap-1"><div class="skeleton h-5 w-12"></div><div class="skeleton h-5 w-12"></div></div>
            </div>
          </div>`;
        grid.appendChild(sk);
      }
      $('#loadMoreTrigger').classList.add('hidden');
    }

    function hideSkeletons() {
      $('#skeletonGrid').classList.add('hidden');
      $('#skeletonGrid').innerHTML = '';
      $('#loadMoreTrigger').classList.remove('hidden');
    }

    /* ================================================================
     *  HERO CAROUSEL
     * ================================================================ */
    function initHero() {
      const featured = MOVIES.slice(0, 3);
      renderHeroContent(featured[heroIndex]);
      renderHeroIndicators(featured);

      $('#heroNext').addEventListener('click', () => { heroIndex = (heroIndex + 1) % featured.length; updateHero(featured); });
      $('#heroPrev').addEventListener('click', () => { heroIndex = (heroIndex - 1 + featured.length) % featured.length; updateHero(featured); });
      // Keyboard nav
      document.addEventListener('keydown', (e) => {
        if (isModalOpen) return;
        if (e.key === 'ArrowRight') { heroIndex = (heroIndex + 1) % featured.length; updateHero(featured); }
        if (e.key === 'ArrowLeft')  { heroIndex = (heroIndex - 1 + featured.length) % featured.length; updateHero(featured); }
      });

      startHeroAutoplay(featured);
      loadHeroBgVideo(featured[heroIndex].trailerId);
    }

    function renderHeroContent(m) {
      $('#heroContent').innerHTML = `
        <div class="animate-fade-up">
          ${m.isUpcoming ? '<span class="inline-block bg-brand-400 text-white text-xs font-bold px-3 py-1 rounded-md mb-4 uppercase tracking-widest">即将上映</span>' : '<span class="inline-block bg-brand-400 text-white text-xs font-bold px-3 py-1 rounded-md mb-4 uppercase tracking-widest">热映中</span>'}
          <h1 class="text-4xl sm:text-5xl lg:text-7xl font-black text-white tracking-tight leading-tight mb-3">${m.title}</h1>
          <p class="text-lg sm:text-xl text-gray-300 mb-2 font-medium">${m.titleEn}</p>
          <div class="flex flex-wrap items-center gap-3 sm:gap-4 mb-4 text-sm text-gray-400">
            <span class="flex items-center gap-1 text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${m.rating} <span class="text-gray-500 font-normal ml-0.5">${m.ratingSite}</span></span>
            <span class="w-1 h-1 rounded-full bg-gray-600"></span>
            <span>${m.year}</span>
            <span class="w-1 h-1 rounded-full bg-gray-600"></span>
            <span>${m.genres.join(' / ')}</span>
            <span class="w-1 h-1 rounded-full bg-gray-600"></span>
            <span>${m.duration}</span>
            <span class="w-1 h-1 rounded-full bg-gray-600"></span>
            <span>${m.releaseDate} 上映</span>
          </div>
          <p class="text-gray-400 leading-relaxed mb-6 max-w-lg line-clamp-3">${m.description}</p>
          <div class="flex gap-3">
            <button onclick="openTrailer('${m.trailerId}','${m.title}')" class="inline-flex items-center gap-2 bg-brand-400 hover:bg-brand-500 text-white px-6 py-3 rounded-xl font-semibold transition-all hover:shadow-lg hover:shadow-brand-400/25 active:scale-95">
              <i class="fa-solid fa-play"></i> 观看预告片
            </button>
            <button class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-xl font-semibold backdrop-blur-sm border border-white/10 transition-all">
              <i class="fa-regular fa-bookmark"></i> 收藏
            </button>
          </div>
        </div>`;
    }

    function renderHeroIndicators(featured) {
      const container = $('#heroIndicators');
      container.innerHTML = featured.map((_, i) =>
        `<button class="hero-indicator w-3 h-3 rounded-full bg-white/40 ${i === heroIndex ? 'active w-8 bg-brand-400' : ''}" data-index="${i}" aria-label="切换到第${i+1}部"></button>`
      ).join('');
      container.querySelectorAll('.hero-indicator').forEach(btn => {
        btn.addEventListener('click', () => {
          heroIndex = parseInt(btn.dataset.index);
          updateHero(featured);
          resetHeroAutoplay(featured);
        });
      });
    }

    function updateHero(featured) {
      const m = featured[heroIndex];
      renderHeroContent(m);
      renderHeroIndicators(featured);
      loadHeroBgVideo(m.trailerId);
    }

    function startHeroAutoplay(featured) {
      heroTimer = setInterval(() => {
        heroIndex = (heroIndex + 1) % featured.length;
        updateHero(featured);
      }, 8000);
    }

    function resetHeroAutoplay(featured) {
      clearInterval(heroTimer);
      startHeroAutoplay(featured);
    }

    // Pause autoplay on hover
    const heroEl = $('#hero');
    if (heroEl) {
      heroEl.addEventListener('mouseenter', () => clearInterval(heroTimer));
      heroEl.addEventListener('mouseleave', () => startHeroAutoplay(MOVIES.slice(0, 3)));
    }

    /* ================================================================
     *  HERO YOUTUBE BACKGROUND
     * ================================================================ */
    function loadHeroBgVideo(videoId) {
      const container = $('#heroYtContainer');
      if (!container) return;
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}&showinfo=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1`;
      iframe.allow = 'autoplay; encrypted-media';
      iframe.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120vw;height:120vh;border:none;';
      iframe.setAttribute('title', '背景预告片');
      container.appendChild(iframe);
    }

    /* ================================================================
     *  TRAILER MODAL — YouTube IFrame API
     * ================================================================ */
    function initYTApi() {
      // Load YouTube IFrame API if not already loaded
      if (document.getElementById('yt-api-script')) return;
      const tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      const firstScript = document.getElementsByTagName('script')[0];
      firstScript.parentNode.insertBefore(tag, firstScript);
    }

    // Called by YT API when ready
    window.onYouTubeIframeAPIReady = function() {
      // API loaded, player created on demand
    };

    window.openTrailer = function(videoId, title) {
      isModalOpen = true;
      document.body.style.overflow = 'hidden';
      $('#modalTitle').textContent = title + ' — 预告片';
      $('#trailerModal').classList.add('open');
      $('#trailerLoading').classList.remove('hidden');
      $('#ytPlayer').innerHTML = '';

      // Create YT player
      if (typeof YT !== 'undefined' && YT.Player) {
        ytPlayer = new YT.Player('ytPlayer', {
          videoId: videoId,
          playerVars: { autoplay: 1, rel: 0, modestbranding: 1, origin: window.location.origin },
          events: {
            onReady: () => { $('#trailerLoading').classList.add('hidden'); $('#modalPlayPause').innerHTML = '<i class="fa-solid fa-pause text-sm"></i>'; },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) { $('#trailerLoading').classList.add('hidden'); }
            },
            onError: () => {
              $('#trailerLoading').innerHTML = '<div class="flex flex-col items-center gap-3"><i class="fa-solid fa-triangle-exclamation text-4xl text-yellow-500"></i><span class="text-gray-300">预告片暂时无法加载，请稍后再试</span></div>';
            }
          }
        });
      } else {
        // Fallback: use iframe directly
        $('#ytPlayer').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" class="w-full h-full" allow="autoplay; encrypted-media" allowfullscreen title="预告片"></iframe>`;
        $('#trailerLoading').classList.add('hidden');
      }
      // Focus trap
      $('#trailerModal').focus();
    };

    window.closeTrailer = function() {
      isModalOpen = false;
      document.body.style.overflow = '';
      $('#trailerModal').classList.remove('open');
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      setTimeout(() => { $('#ytPlayer').innerHTML = ''; ytPlayer = null; }, 400);
    };

    // Modal controls
    function initModalControls() {
      $('#trailerModal').addEventListener('click', (e) => {
        if (e.target === $('#trailerModal')) closeTrailer();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isModalOpen) closeTrailer();
      });

      // Play/Pause
      $('#modalPlayPause').addEventListener('click', () => {
        if (!ytPlayer) return;
        const btn = $('#modalPlayPause');
        if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
          ytPlayer.pauseVideo();
          btn.innerHTML = '<i class="fa-solid fa-play text-sm"></i>';
        } else {
          ytPlayer.playVideo();
          btn.innerHTML = '<i class="fa-solid fa-pause text-sm"></i>';
        }
      });

      // Volume
      $('#modalVolume').addEventListener('input', function() {
        if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(parseInt(this.value));
      });

      // Fullscreen
      $('#modalFullscreen').addEventListener('click', () => {
        const iframe = $('#ytPlayer').querySelector('iframe');
        const el = iframe || $('#ytPlayer');
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      });
    }

    /* ================================================================
     *  INIT
     * ================================================================ */
    function init() {
      initTheme();
      initNavScroll();
      initMobileMenu();
      initSearch();
      initFilters();
      initHero();
      initInfiniteScroll();
      initYTApi();
      initModalControls();
      renderMovies();
    }

    // Boot when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

  🔧 如何添加新电影
    在 MOVIES 数组中添加新对象，格式如下：

    {
      id: 19,                              // 唯一 ID
      title: '电影名称',                    // 中文名
      titleEn: 'Movie Title',              // 英文名
      year: 2026,                          // 年份
      rating: 8.5,                         // 评分
      ratingSite: 'IMDb',                  // 评分来源
      genres: ['动作', '科幻'],            // 类型数组
      duration: '120分钟',                  // 片长
      director: '导演名',                   // 导演
      description: '剧情简介...',           // 简介 (1-2 句)
      posterColor: 'linear-gradient(135deg, #1a3a5c, #2d6bc4)',  // 海报渐变色
      posterEmoji: '🎬',                    // 海报占位表情
      trailerId: 'YOUTUBE_VIDEO_ID',       // YouTube 视频 ID (替换真实 ID)
      releaseDate: '2026-08-15',           // 上映日期 (YYYY-MM-DD)
      isUpcoming: true,                    // 是否即将上映
    }

  🎨 如何修改配色
    · 品牌色: 搜索 #FF4D4D → 全局替换
    · 深色背景: 搜索 #0a0a0f / navy 色值
    · Tailwind 配置: 见 <script> 中 tailwind.config

  📝 关于 YouTube 预告片 ID
    trailerId 是 YouTube 视频 URL 中 v= 后面的部分
    例如: https://www.youtube.com/watch?v=b3XGCjU_y7o → "b3XGCjU_y7o"
    请确保替换为你自己的真实视频 ID

  🌐 部署方式
    单个 HTML 文件，可直接用任何静态服务器托管
    例如: npx serve . / python -m http.server / Netlify / Vercel
